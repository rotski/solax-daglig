name: Hämta daglig SolaX-data

on:
  workflow_dispatch:

jobs:
  hamta-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera beroenden
        run: pip install requests

      - name: Hämta data (med retry)
        env:
          SOLAX_CLIENT_ID:     ${{ secrets.SOLAX_CLIENT_ID }}
          SOLAX_CLIENT_SECRET: ${{ secrets.SOLAX_CLIENT_SECRET }}
          SOLAX_SN:            ${{ secrets.SOLAX_SN }}
        run: |
          for i in 1 2 3; do
            echo "Försök $i..."
            python solax_daglig.py && break
            if [ $i -lt 3 ]; then
              echo "Misslyckades, väntar 15 minuter..."
              sleep 900
            else
              echo "Alla 3 försök misslyckades."
              exit 1
            fi
          done

      - name: Committa och pusha uppdateringar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add solax_data.csv docs/index.html
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
